name: Wiki Lint

permissions:
  contents: read

on:
  push:
    branches: [master, main]
    paths:
      - 'wiki/**'
      - 'index.md'
      - 'scripts/**'
      - 'hooks/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/wiki-lint.yml'
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Install dependencies
        run: uv sync

      - name: Check index is up to date
        run: uv run python scripts/rebuild_index.py --check

      - name: Run structural lint
        run: uv run python scripts/lint.py --structural-only

      - name: Ruff check
        run: uv run ruff check scripts/ hooks/ tests/

      - name: Ruff format check
        run: uv run ruff format --check scripts/ hooks/ tests/

      - name: Pytest
        run: uv run pytest

      - name: Syntax check all Python files
        run: |
          uv run python - <<'PY'
          import ast
          import subprocess
          import sys
          from pathlib import Path

          files = subprocess.check_output(["git", "ls-files", "*.py"], text=True).splitlines()
          errors = 0
          for file_name in files:
              try:
                  ast.parse(Path(file_name).read_text(encoding="utf-8"), filename=file_name)
              except SyntaxError as exc:
                  print(f"FAIL {file_name}: {exc}")
                  errors += 1
          if errors:
              sys.exit(1)
          print(f"All {len(files)} tracked Python files OK")
          PY

  pytest-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Install dependencies
        run: uv sync

      - name: Pytest
        run: uv run pytest
